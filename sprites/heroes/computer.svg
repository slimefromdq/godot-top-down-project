<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
<!-- SPRITE SLOT: placeholder body (glossy aero badge) for computer (flex). Silhouette = role, colour + letter = hero. True top-down: never rotates with the aim. Replace with final art at this path. -->
<defs>
<radialGradient id="aero-body" cx="0.4" cy="0.3" r="0.8">
<stop offset="0" stop-color="#fff8e6"/><stop offset="0.55" stop-color="#e7dcc0"/><stop offset="1" stop-color="#a39570"/>
</radialGradient>
<linearGradient id="aero-gloss" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
</linearGradient>
<clipPath id="aero-clip"><polygon points="64.0,8.0 121.1,49.5 99.3,116.5 28.7,116.5 6.9,49.5" /></clipPath>
</defs>
<polygon points="64.0,8.0 121.1,49.5 99.3,116.5 28.7,116.5 6.9,49.5" fill="url(#aero-body)" stroke="#16304f" stroke-width="7" stroke-linejoin="round"/>
<ellipse cx="64" cy="36" rx="46" ry="26" fill="url(#aero-gloss)" clip-path="url(#aero-clip)"/>
<text x="64" y="84" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="56" fill="#ffffff" stroke="#16304f" stroke-width="6" paint-order="stroke">C</text>
</svg>
